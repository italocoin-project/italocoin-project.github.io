name: Archive public exchange market data
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-market-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Collect Coinbase spot prices
        run: |
          set -euo pipefail
          mkdir -p data/market
          DATE=$(date -u +%F)
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          QUOTES="{}"
          for SYMBOL in BTC ETH BNB SOL XRP ADA DOGE TRX TON AVAX LINK DOT LTC BCH XLM UNI AAVE NEAR ETC FIL ICP ATOM ARB OP SUI SHIB PEPE INJ SEI HBAR; do
            RESPONSE=$(curl -sS --max-time 12 "https://api.coinbase.com/v2/prices/${SYMBOL}-USD/spot" || true)
            PRICE=$(printf '%s' "$RESPONSE" | jq -r '.data.amount // empty' 2>/dev/null || true)
            if [ -n "$PRICE" ] && jq -en --arg p "$PRICE" '($p|tonumber) > 0' >/dev/null 2>&1; then
              QUOTES=$(jq -cn --argjson old "$QUOTES" --arg sym "$SYMBOL" --argjson p "$PRICE" '$old + {($sym): {coinbase: $p}}')
            fi
          done
          [ "$QUOTES" != "{}" ] || { echo "No valid Coinbase spot prices returned"; exit 1; }
          jq -cn --arg ts "$TS" --argjson q "$QUOTES" '{timestamp_utc:$ts,source:"Coinbase public spot API",quotes:$q}' >> "data/market/${DATE}.jsonl"
          echo "Archived Coinbase prices for $(printf '%s' "$QUOTES" | jq 'keys | length') assets"
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market
          if git diff --cached --quiet; then echo "No archive changes"; exit 0; fi
          git commit -m "Archive Coinbase market prices"
          git push
