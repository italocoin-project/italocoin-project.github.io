name: Update CoinMarketCap static cache
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cmc-static-cache
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: python3 --version
      - name: Update CoinMarketCap cache
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python3 scripts/update_cmc_cache.py
      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/cmc-market.json api/v1/coins.json
          if git diff --cached --quiet; then echo "Cache unchanged"; exit 0; fi
          git commit -m "Refresh CoinMarketCap market cache"
          git push
